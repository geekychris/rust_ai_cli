[package]
name = "rustaicli"
version = "0.1.0"
edition = "2021"
description = "A CLI tool for AI prompt processing with local LLM support"
authors = ["Your Name <your.email@example.com>"]

[dependencies]
clap = { version = "4.4.6", features = ["derive", "env"] }
tokio = { version = "1.32.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
llm = { version = "0.1.1" }
llm-base = "0.1.1"
llm-llama = "0.1.1"
async-trait = "0.1.75"
tokio-stream = "0.1"
futures = "0.3"
atty = "0.2.14"
rand = "0.8.5"
reqwest = { version = "0.11", features = ["json"] }
